<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit IA</title>
<style>
/* Visual aprovado pelo Artur: docs/referencia-visual-A.html (direção A, terracota). */
:root {
  --destaque: #b5462a;
  --papel: #fbf8f1; --lateral: #f5f0e4; --borda: #e5dfd0; --borda-forte: #d8cfb8;
  --tinta: #2a2620; --suave: #7a705c; --grupo: #8a7f68; --tracejado: #e0d7c2;
  --codigo: #24211c; --codigo-texto: #f1ece1; --codigo-botao: #3a352d;
  --rascunho: #c28a1e; --rascunho-fundo: #fbf1da;
  --leve: color-mix(in srgb, var(--destaque) 12%, var(--papel));
  --leve-borda: color-mix(in srgb, var(--destaque) 35%, var(--papel));
  --serifa: Georgia, "Iowan Old Style", serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }
.kit { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

/* barra lateral */
.lado { border-right: 1px solid var(--borda); padding: 16px 14px; background: var(--lateral); overflow-y: auto; }
.marca { font: 600 18px var(--serifa); margin-bottom: 12px; }
.marca b { color: var(--destaque); }
.busca { width: 100%; padding: 7px 10px; border: 1px solid var(--borda-forte); border-radius: 6px; background: #fff; font-size: 13px; }
.contagem { font-size: 12px; color: var(--suave); margin: 4px 2px 0; min-height: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 8px 0 14px; border: 1px solid var(--borda-forte); border-radius: 6px; overflow: hidden; font-size: 12.5px; }
.seg button { border: 0; background: none; padding: 5px 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--grupo); margin: 12px 0 4px; }
.menu ul { list-style: none; margin: 0; padding: 0; }
.item { display: block; padding: 4px 8px; border-radius: 5px; font-size: 14px; border-left: 3px solid transparent; color: inherit; text-decoration: none; }
.item:hover { background: color-mix(in srgb, var(--leve) 60%, transparent); }
.item[aria-current="page"] { background: var(--leve); border-left-color: var(--destaque); font-weight: 600; }
.vazio { font-size: 13px; color: var(--suave); padding: 4px 2px; }

/* área principal */
.principal { overflow-y: auto; }
.abas { display: flex; gap: 18px; padding: 12px 28px 0; border-bottom: 1px solid var(--borda); font-size: 14px; position: sticky; top: 0; background: var(--papel); z-index: 1; }
.abas a { white-space: nowrap; padding-bottom: 9px; color: var(--suave); text-decoration: none; border-bottom: 2px solid transparent; }
.abas a[aria-current="page"] { color: var(--tinta); border-bottom-color: var(--destaque); font-weight: 600; }
.botao-menu { display: none; }
main { padding: 18px 28px 40px; max-width: 700px; }
main:focus { outline: none; }
h1 { font: 600 28px/1.2 var(--serifa); margin: 0 0 8px; }
h2 { font: 600 17px var(--serifa); margin: 16px 0 4px; }
main p, main li { font-size: 14.5px; }
main p { margin: 0 0 6px; }
main a { color: var(--destaque); }
.tags span { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--borda-forte); margin: 0 4px 4px 0; }
.tags span.obj { border-color: var(--leve-borda); color: var(--destaque); background: var(--leve); }
.rascunho { margin: 10px 0; padding: 6px 10px; border-left: 3px solid var(--rascunho); background: var(--rascunho-fundo); font-size: 13px; }
code { font: 13px var(--mono); }
:not(pre) > code { background: color-mix(in srgb, var(--borda) 60%, transparent); padding: 1px 4px; border-radius: 4px; }

/* exemplos e código */
.ex { border-bottom: 1px dashed var(--tracejado); padding: 7px 0; }
.ex-linha { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px; }
.ex-linha > div > p { margin: 0; font-size: 14px; }
.ver { font: 13px system-ui, sans-serif; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--leve-borda); background: #fff; color: var(--destaque); cursor: pointer; white-space: nowrap; }
.ver[aria-expanded="true"] { background: var(--destaque); color: #fff; border-color: var(--destaque); }
.bloco-codigo { margin: 8px 0 2px; background: var(--codigo); color: var(--codigo-texto); padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.bloco-codigo[hidden] { display: none; }
.bloco-codigo pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.bloco-codigo code { font: inherit; background: none; padding: 0; }
.copiar { font: 12px system-ui, sans-serif; padding: 3px 9px; border-radius: 6px; border: 0; background: var(--codigo-botao); color: var(--codigo-texto); cursor: pointer; flex: none; }

/* tabelas */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 6px 0 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--borda); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); }
.atualizado { margin-top: 18px; font-size: 12.5px; color: var(--suave); }

/* celular */
@media (max-width: 800px) {
  .kit { grid-template-columns: 1fr; }
  .lado { position: fixed; inset: 0 25% 0 0; z-index: 3; transform: translateX(-105%); visibility: hidden; transition: transform .2s ease, visibility .2s; box-shadow: 0 0 24px rgba(0,0,0,.15); }
  .lado.aberto { transform: none; visibility: visible; transition: transform .2s ease; }
  .botao-menu { display: block; margin-left: auto; border: 0; background: none; font-size: 20px; line-height: 1; padding: 0 0 9px; cursor: pointer; }
  .abas { gap: 14px; padding: 12px 14px 0; overflow-x: auto; }
  main { padding: 14px 14px 32px; }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .lado { transition: none; } }
</style>

</head>
<body>
<div class="kit">
  <aside class="lado" id="lado" aria-label="Navegação">
    <div class="marca">Kit <b>IA</b></div>
    <input class="busca" id="busca" type="search" placeholder="Buscar…" aria-label="Buscar nas fichas">
    <div class="contagem" id="contagem" aria-live="polite"></div>
    <div class="seg" role="group" aria-label="Organizar o menu">
      <button type="button" data-modo="recurso" aria-pressed="true">Por recurso</button>
      <button type="button" data-modo="objetivo" aria-pressed="false">Por objetivo</button>
    </div>
    <nav class="menu" id="menu" aria-label="Fichas"></nav>
  </aside>
  <div class="principal" id="principal">
    <nav class="abas" aria-label="Seções">
      <a href="#/" data-aba="fichas">Fichas</a>
      <a href="#/glossario" data-aba="glossario">Glossário</a>
      <a href="#/cola" data-aba="cola">Cola rápida</a>
      
      <button type="button" class="botao-menu" id="botao-menu" aria-controls="lado" aria-expanded="false" aria-label="Abrir o menu">☰</button>
    </nav>
    <main id="conteudo" tabindex="-1"></main>
  </div>
</div>
<script id="kit-data" type="application/json">{"modo": "colegas", "objetivos": [{"id": "automatizar", "nome": "Automatizar tarefas repetitivas"}, {"id": "conectar", "nome": "Conectar o Claude a dados e ferramentas externas"}, {"id": "verificar", "nome": "Verificar a qualidade e a segurança do resultado"}, {"id": "dividir", "nome": "Dividir trabalho complexo em partes"}, {"id": "pesquisar", "nome": "Pesquisar e coletar informação"}, {"id": "construir", "nome": "Construir produtos próprios com a API"}, {"id": "padronizar", "nome": "Padronizar e reaproveitar, principalmente em equipe"}, {"id": "organizar", "nome": "Organizar o trabalho e não perder o contexto entre sessões"}], "fichas": [{"slug": "claude-md", "titulo": "CLAUDE.md e memória", "tipo": "Claude Code", "objetivos": ["padronizar", "organizar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Arquivos de texto com instruções que o Claude lê \u003cstrong>no início de toda sessão\u003c/strong>, e não a cada mensagem: como é o projeto, que comandos usar, regras e preferências. Funcionam como um \"manual da casa\" que você escreve uma vez.\u003c/p>\n\u003cp>Há vários níveis, e todos valem juntos:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>~/.claude/CLAUDE.md\u003c/code>: suas preferências pessoais, em todos os projetos.\u003c/li>\n\u003cli>\u003ccode>CLAUDE.md\u003c/code> (ou \u003ccode>.claude/CLAUDE.md\u003c/code>) na pasta do projeto: regras do projeto, compartilhadas com a equipe pelo git.\u003c/li>\n\u003cli>\u003ccode>CLAUDE.local.md\u003c/code> na pasta do projeto: anotações só suas daquele projeto.\u003c/li>\n\u003cli>\u003ccode>CLAUDE.md\u003c/code> em subpastas: carregados só quando o Claude trabalha ali.\u003c/li>\n\u003c/ul>\n\u003cp>Além disso, há a \u003cstrong>memória automática\u003c/strong>: notas que o próprio Claude escreve a partir das suas correções e preferências, guardadas em \u003ccode>~/.claude/projects/&lt;projeto&gt;/memory/\u003c/code>.\u003c/p>", "Quando usar": "\u003cp>Sempre que você se pegar repetindo a mesma explicação no começo das conversas: \"use Python 3.12\", \"rode os testes com tal comando\", \"escreva em português\", \"não mexa na pasta X\". Coloque no \u003ccode>CLAUDE.md\u003c/code> do nível certo: pessoal (todos os projetos) ou do projeto (vale para a equipe).\u003c/p>\n\u003cp>\u003cstrong>Dicas para escrever bem:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Não destaque tudo.\u003c/strong> Se tudo é \"IMPORTANTE\" ou \"NUNCA\", nada se destaca, e o destaque perde o efeito. Guarde a ênfase para as poucas regras que realmente não podem falhar.\u003c/li>\n\u003cli>\u003cstrong>Seja claro e específico, sem margem para interpretação.\u003c/strong> Escreva \"rode \u003ccode>python3 -m unittest discover -s tests\u003c/code>\" em vez de \"rode os testes\"; \"não altere \u003ccode>dados/brutos/\u003c/code>\" em vez de \"cuidado com os dados\". Quanto menos o Claude precisar adivinhar, menos ele \"viaja\" na hora de executar.\u003c/li>\n\u003cli>\u003cstrong>Frases curtas, em lista,\u003c/strong> uma instrução por linha.\u003c/li>\n\u003cli>\u003cstrong>Diga o porquê\u003c/strong> quando a regra não for óbvia: ajuda o Claude a aplicá-la nos casos parecidos.\u003c/li>\n\u003cli>\u003cstrong>Mantenha atualizado:\u003c/strong> instrução velha ou contraditória confunde mais do que ajuda.\u003c/li>\n\u003c/ul>", "Exemplos": "\u003cul>\n\u003cli>Criar um \u003ccode>CLAUDE.md\u003c/code> inicial para o projeto, gerado pelo Claude\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/init\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Um \u003ccode>CLAUDE.md\u003c/code> de projeto curto e direto\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-markdown\"># Projeto Relatórios\n\n- Python 3.12; dependências em requirements.txt.\n- Testes: python3 -m unittest discover -s tests\n- Escreva textos para o cliente em português formal.\n- Nunca altere os arquivos em dados/brutos/.\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Trazer outro arquivo para dentro do \u003ccode>CLAUDE.md\u003c/code>, sem copiar o conteúdo\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-markdown\">Siga o guia de estilo em @docs/guia-de-estilo.md\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Ver e editar os \u003ccode>CLAUDE.md\u003c/code> e a memória automática de dentro da sessão: \u003ccode>/memory\u003c/code> (no terminal)\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>Ele é lido \u003cstrong>uma vez, no início da sessão\u003c/strong>, e não a cada mensagem. Numa conversa longa, essas instruções ficam \"lá atrás\" e podem perder força. O Claude trata o \u003ccode>CLAUDE.md\u003c/code> como \u003cstrong>contexto, não como regra obrigatória\u003c/strong>: para o que precisa acontecer \u003cstrong>sempre\u003c/strong>, use um \u003cstrong>hook\u003c/strong>.\u003c/li>\n\u003cli>Ele ocupa espaço na janela de contexto em toda sessão. A recomendação oficial é ficar \u003cstrong>abaixo de ~200 linhas\u003c/strong> por arquivo; quanto mais curto e específico, mais o Claude segue.\u003c/li>\n\u003cli>O \u003ccode>CLAUDE.md\u003c/code> do projeto vai para o git e para a equipe: nada de senha, chave de API ou dado de cliente nele.\u003c/li>\n\u003cli>Instruções contraditórias entre níveis confundem o Claude; revise de vez em quando.\u003c/li>\n\u003c/ul>"}}, {"slug": "conectores", "titulo": "Conectores", "tipo": "Integrações", "objetivos": ["conectar", "pesquisar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Ligações entre o Claude e outros serviços (Google Drive, Gmail, Agenda, Canva...). Com um conector, o Claude \u003cstrong>busca, lê e às vezes altera\u003c/strong> dados nesses serviços sem você copiar e colar nada. Você conecta uma vez, e o conector vale no chat do Claude, no app e no Claude Code.\u003c/p>\n\u003cp>Para adicionar: \u003cstrong>Customize &gt; Connectors\u003c/strong>, botão \u003cstrong>+\u003c/strong>, ou o \u003cstrong>+\u003c/strong> no canto da caixa de mensagem &gt; \u003cstrong>Connectors\u003c/strong>. A lista oficial fica em claude.ai/directory.\u003c/p>", "Quando usar": "\u003cp>Quando a resposta depende de algo que está fora da conversa: um documento no Drive, uma informação atual na web, um compromisso na agenda.\u003c/p>", "Exemplos": "\u003cul>\n\u003cli>\u003cstrong>Google Drive\u003c/strong> (recomendado): procura e lê documentos, planilhas e apresentações. Ex.: \"resuma a ata da reunião de ontem que está no Drive\".\u003c/li>\n\u003cli>\u003cstrong>Perplexity\u003c/strong> (recomendado): pesquisa na web e responde \u003cstrong>com as fontes citadas\u003c/strong>. Ex.: \"quais as mudanças na norma X em 2026? cite as fontes\".\u003c/li>\n\u003cli>\u003cstrong>Firecrawl\u003c/strong> (recomendado): lê páginas da web e devolve o texto limpo; também faz buscas e extrai dados de vários sites. Ex.: \"leia a página de preços deste site e monte uma tabela\".\u003c/li>\n\u003cli>Outros conectores comuns: Gmail, Google Calendar, Canva, Notion, Slack.\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>O conector age \u003cstrong>com a sua conta\u003c/strong>: o Claude vê e pode alterar o que você pode ver e alterar. Conecte só o que você precisa e desconecte o que não usa.\u003c/li>\n\u003cli>Em \u003cstrong>Customize &gt; Connectors\u003c/strong>, cada ação pode ficar como \"sempre permitir\", \"pedir aprovação\" ou \"bloqueada\". Deixe as ações que \u003cstrong>enviam ou apagam\u003c/strong> (mandar e-mail, apagar arquivo) em \"pedir aprovação\".\u003c/li>\n\u003cli>Conectores personalizados (fora do diretório oficial) não são verificados pela Anthropic: use só os de empresas confiáveis.\u003c/li>\n\u003cli>Firecrawl e Perplexity exigem uma conta própria no serviço, e o uso pode ter custo ou consumir créditos.\u003c/li>\n\u003cli>Os dados passam pelos servidores do serviço conectado, com as regras dele. Cuidado com dados de clientes.\u003c/li>\n\u003c/ul>"}}, {"slug": "hooks", "titulo": "Hooks", "tipo": "Claude Code", "objetivos": ["automatizar", "verificar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Comandos que o \u003cstrong>próprio programa\u003c/strong> (Claude Code) roda automaticamente em momentos fixos do trabalho, sem depender de o Claude lembrar. Os momentos mais usados são: antes de usar uma ferramenta (\u003ccode>PreToolUse\u003c/code>), depois de usar (\u003ccode>PostToolUse\u003c/code>), quando o Claude termina de responder (\u003ccode>Stop\u003c/code>) e no início da sessão (\u003ccode>SessionStart\u003c/code>); há mais de 30 eventos no total.\u003c/p>\n\u003cp>Ficam no \u003ccode>settings.json\u003c/code>: \u003ccode>~/.claude/settings.json\u003c/code> vale para todos os projetos; \u003ccode>.claude/settings.json\u003c/code> vale só para um projeto. Plugins, skills e subagentes também podem trazer hooks. O campo \u003ccode>matcher\u003c/code> filtra quando o hook dispara (por exemplo, só depois de \u003ccode>Edit\u003c/code> ou \u003ccode>Write\u003c/code>).\u003c/p>", "Quando usar": "\u003cp>Quando algo \u003cstrong>precisa\u003c/strong> acontecer sempre, e não \"se o Claude lembrar\": formatar o código depois de cada edição, bloquear um comando perigoso, rodar os testes ao final. Se é só uma preferência de estilo, uma instrução no \u003ccode>CLAUDE.md\u003c/code> basta; se é regra, vira hook.\u003c/p>", "Exemplos": "\u003cul>\n\u003cli>Formatar o código Python depois de cada edição\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;hooks&quot;: {\n    &quot;PostToolUse&quot;: [\n      {\n        &quot;matcher&quot;: &quot;Edit|Write&quot;,\n        &quot;hooks&quot;: [{ &quot;type&quot;: &quot;command&quot;, &quot;command&quot;: &quot;ruff format .&quot; }]\n      }\n    ]\n  }\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Bloquear um comando antes de ele rodar (o código de saída 2 impede a ferramenta e devolve a mensagem ao Claude)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-python\">import json, sys\n\ndados = json.load(sys.stdin)\ncomando = dados[&quot;tool_input&quot;].get(&quot;command&quot;, &quot;&quot;)\nif &quot;git push --force&quot; in comando:\n    print(&quot;Bloqueado: push forçado não é permitido.&quot;, file=sys.stderr)\n    sys.exit(2)\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Rodar os testes quando o Claude terminar e, se falharem, fazê-lo continuar para corrigir (no evento \u003ccode>Stop\u003c/code>, o código de saída 2 impede o Claude de parar)\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>Hooks de comando rodam com \u003cstrong>todas as suas permissões\u003c/strong> de usuário: podem alterar ou apagar qualquer arquivo seu. Revise e teste antes de ativar, e desconfie de hooks de plugins de terceiros.\u003c/li>\n\u003cli>Um hook lento atrasa cada ação do Claude.\u003c/li>\n\u003cli>O código de saída muda o comportamento: 0 = segue normal; 2 = bloqueia (em \u003ccode>PreToolUse\u003c/code>) ou impede de parar (em \u003ccode>Stop\u003c/code>).\u003c/li>\n\u003cli>O modo \u003ccode>--bare\u003c/code> desliga os hooks das configurações e dos plugins.\u003c/li>\n\u003c/ul>"}}, {"slug": "bare", "titulo": "Modo --bare (CI)", "tipo": "Claude Code", "objetivos": ["padronizar", "automatizar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>\u003cstrong>Recurso de terminal e automação.\u003c/strong> Não existe no app. Interessa a quem for montar scripts, agendamentos ou CI.\u003c/p>\n\u003cp>Um modo mínimo do Claude Code, ligado com \u003ccode>--bare\u003c/code>, quase sempre junto com \u003ccode>-p\u003c/code>. Nele, o Claude \u003cstrong>não carrega nada da máquina\u003c/strong>: nem hooks, skills, subagentes, plugins ou servidores MCP, nem a memória automática ou o \u003ccode>CLAUDE.md\u003c/code>. Ele começa só com as ferramentas básicas (terminal, ler e editar arquivos) e com o que você passar explicitamente no comando.\u003c/p>\n\u003cp>Assim, o mesmo comando dá o mesmo resultado em qualquer computador: no seu, no de um colega ou no servidor de CI. Ele também começa mais rápido. A documentação recomenda \u003ccode>--bare\u003c/code> para chamadas em script e diz que ele vai virar o padrão do \u003ccode>-p\u003c/code> numa versão futura.\u003c/p>", "Quando usar": "\u003cul>\n\u003cli>Em CI (GitHub Actions, GitLab) e em scripts que outras pessoas vão rodar: o resultado não pode depender dos hooks ou do \u003ccode>CLAUDE.md\u003c/code> de quem executa.\u003c/li>\n\u003cli>Ao rodar o Claude num repositório que você não conhece. Sem \u003ccode>--bare\u003c/code>, um \u003ccode>claude -p\u003c/code> roda os hooks do \u003ccode>.claude/settings.json\u003c/code> do projeto e conecta os servidores do \u003ccode>.mcp.json\u003c/code> dele, mesmo numa pasta em que você nunca confiou.\u003c/li>\n\u003c/ul>", "Exemplos": "\u003cul>\n\u003cli>Resumir um arquivo liberando só a leitura\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude --bare -p &quot;resuma o README.md&quot; --allowedTools &quot;Read&quot;\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Passar o contexto que o modo mínimo não carrega sozinho (instruções, servidores MCP, configurações)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude --bare -p &quot;revise o diff em busca de erros&quot; \\\n  --append-system-prompt-file instrucoes-revisao.md \\\n  --mcp-config mcp-ci.json \\\n  --settings settings-ci.json\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Outras opções para passar contexto: \u003ccode>--system-prompt\u003c/code>, \u003ccode>--add-dir\u003c/code> (lê o \u003ccode>CLAUDE.md\u003c/code> dessa pasta), \u003ccode>--agents\u003c/code> e \u003ccode>--plugin-dir\u003c/code>.\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>\u003cstrong>Exige chave de API\u003c/strong>: o \u003ccode>--bare\u003c/code> aceita só \u003ccode>ANTHROPIC_API_KEY\u003c/code> (ou um \u003ccode>apiKeyHelper\u003c/code>) e não usa o login da assinatura Pro/Max. Guarde a chave nos segredos do CI, nunca no código.\u003c/li>\n\u003cli>Como nada é carregado, regras que você confia ao \u003ccode>CLAUDE.md\u003c/code> ou a um hook (por exemplo, bloquear \u003ccode>git push\u003c/code>) \u003cstrong>não valem\u003c/strong>. Repita no próprio comando o que importa (\u003ccode>--allowedTools\u003c/code>, \u003ccode>--settings\u003c/code>).\u003c/li>\n\u003cli>As mesmas regras do \u003ccode>-p\u003c/code> valem aqui: ninguém aprova nada durante a execução, então libere só o necessário.\u003c/li>\n\u003c/ul>"}}, {"slug": "headless", "titulo": "Modo headless (claude -p)", "tipo": "Claude Code", "objetivos": ["automatizar", "construir"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>\u003cstrong>Recurso de terminal e automação.\u003c/strong> Não existe no app, que é só interativo. Interessa a quem for montar scripts, agendamentos ou CI.\u003c/p>\n\u003cp>Um jeito de usar o Claude Code \u003cstrong>sem conversa\u003c/strong>: você passa o pedido na linha de comando com \u003ccode>-p\u003c/code> (de \u003ccode>--print\u003c/code>), ele trabalha, imprime a resposta e termina. Dá para usar o \u003ccode>-p\u003c/code> dentro de scripts, agendamentos e pipelines de CI, como qualquer outro comando do terminal.\u003c/p>\n\u003cp>Ele aceita texto pela entrada (\u003ccode>cat arquivo | claude -p \"...\"\u003c/code>) e a saída pode ir para um arquivo. Com \u003ccode>--output-format json\u003c/code>, a resposta vem num JSON que traz o texto no campo \u003ccode>result\u003c/code>, o ID da sessão e o custo (\u003ccode>total_cost_usd\u003c/code>). Com \u003ccode>--json-schema\u003c/code>, o Claude responde no formato que você definir, e a resposta vem no campo \u003ccode>structured_output\u003c/code>.\u003c/p>", "Quando usar": "\u003cp>Quando a mesma tarefa com o Claude precisa rodar sem você por perto, ou muitas vezes: resumir um log de erro, revisar o diff antes de um commit, gerar um relatório toda manhã, processar uma lista de arquivos. Também é o primeiro passo para pôr o Claude dentro de um programa seu, antes de partir para o Agent SDK.\u003c/p>", "Exemplos": "\u003cul>\n\u003cli>Explicar um erro de build e salvar a explicação num arquivo\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">cat erro-build.txt | claude -p &quot;explique a causa do erro em poucas linhas&quot; &gt; explicacao.txt\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Criar o commit liberando só os comandos de git necessários\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude -p &quot;veja as mudanças em stage e crie um commit adequado&quot; \\\n  --allowedTools &quot;Bash(git diff *),Bash(git log *),Bash(git status *),Bash(git commit *)&quot;\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Receber dados estruturados, prontos para outro programa usar\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude -p &quot;liste as funções definidas em main.py&quot; \\\n  --output-format json \\\n  --json-schema '{&quot;type&quot;:&quot;object&quot;,&quot;properties&quot;:{&quot;funcoes&quot;:{&quot;type&quot;:&quot;array&quot;,&quot;items&quot;:{&quot;type&quot;:&quot;string&quot;}}},&quot;required&quot;:[&quot;funcoes&quot;]}'\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\n\u003cp>Continuar a conversa anterior num segundo comando: \u003ccode>claude -p --continue \"agora escreva os testes\"\u003c/code>.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>Pôr um teto de gasto na execução: \u003ccode>--max-budget-usd 1\u003c/code>.\u003c/p>\n\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>No \u003ccode>-p\u003c/code> ninguém está olhando para aprovar. No modo padrão, toda ação que precisaria de aprovação é \u003cstrong>recusada\u003c/strong>. Libere com \u003ccode>--allowedTools\u003c/code> só o que a tarefa precisa, ou escolha um \u003ccode>--permission-mode\u003c/code>. Evite \u003ccode>--dangerously-skip-permissions\u003c/code> fora de um container.\u003c/li>\n\u003cli>Num script, prefira \u003ccode>--bare\u003c/code>: ele ignora hooks, plugins e o \u003ccode>CLAUDE.md\u003c/code> da máquina, e o resultado não muda de um computador para outro. A documentação diz que \u003ccode>--bare\u003c/code> vai virar o padrão do \u003ccode>-p\u003c/code> numa versão futura.\u003c/li>\n\u003cli>A entrada por pipe tem limite de 10 MB.\u003c/li>\n\u003cli>Nem toda opção funciona junto com \u003ccode>-p\u003c/code> (por exemplo, \u003ccode>--bg\u003c/code> é recusado).\u003c/li>\n\u003cli>Sessões do \u003ccode>-p\u003c/code> não aparecem na lista do \u003ccode>--resume\u003c/code>; para voltar a elas, guarde o \u003ccode>session_id\u003c/code> do JSON.\u003c/li>\n\u003cli>Cada execução gasta tokens. Um script num loop ou num agendamento pode sair caro: use \u003ccode>--max-budget-usd\u003c/code>.\u003c/li>\n\u003c/ul>"}}, {"slug": "permissoes", "titulo": "Permissões", "tipo": "Claude Code", "objetivos": ["verificar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Regras que dizem o que o Claude pode fazer \u003cstrong>sem perguntar\u003c/strong>, o que ele \u003cstrong>deve perguntar\u003c/strong> antes e o que fica \u003cstrong>proibido\u003c/strong>. São três listas: \u003ccode>allow\u003c/code> (libera), \u003ccode>ask\u003c/code> (pergunta) e \u003ccode>deny\u003c/code> (proíbe). O Claude confere as regras nesta ordem: primeiro \u003ccode>deny\u003c/code>, depois \u003ccode>ask\u003c/code>, por último \u003ccode>allow\u003c/code>. Vale a primeira que bater, mesmo que outra regra seja mais específica.\u003c/p>\n\u003cp>As regras ficam no \u003ccode>settings.json\u003c/code>: \u003ccode>~/.claude/settings.json\u003c/code> vale para todos os projetos, \u003ccode>.claude/settings.json\u003c/code> vale para o projeto e vai para o git, e \u003ccode>.claude/settings.local.json\u003c/code> vale só na sua máquina. No terminal, \u003ccode>/permissions\u003c/code> mostra todas as regras e de qual arquivo cada uma vem. No app esse comando não abre: edite o \u003ccode>settings.json\u003c/code> ou peça ao Claude para editar.\u003c/p>\n\u003cp>Além das regras, existe o \u003cstrong>modo de permissão\u003c/strong> da sessão. No app, troque o modo no seletor abaixo da caixa de mensagem (no terminal, \u003ccode>Shift+Tab\u003c/code>):\n- \u003ccode>default\u003c/code> (aparece como \"Manual\"): pergunta na primeira vez que o Claude usa cada ferramenta.\n- \u003ccode>acceptEdits\u003c/code>: aceita sozinho as edições de arquivo e comandos simples como \u003ccode>mkdir\u003c/code> e \u003ccode>mv\u003c/code> dentro da pasta do projeto.\n- \u003ccode>plan\u003c/code>: o Claude só lê e planeja; não altera o código.\n- \u003ccode>auto\u003c/code>: não pergunta nas ações de rotina; um classificador confere, antes de cada comando ou acesso à rede, se a ação bate com o seu pedido.\n- \u003ccode>dontAsk\u003c/code>: recusa sozinho tudo o que precisaria perguntar; roda só o que já está liberado.\n- \u003ccode>bypassPermissions\u003c/code>: não pergunta quase nada.\u003c/p>", "Quando usar": "\u003cp>Quando você cansa de aprovar sempre o mesmo comando seguro (rodar os testes, \u003ccode>git status\u003c/code>), ou quando quer ter certeza de que algo \u003cstrong>nunca\u003c/strong> vai acontecer (ler o \u003ccode>.env\u003c/code>, dar \u003ccode>git push\u003c/code>). Regras no \u003ccode>.claude/settings.json\u003c/code> do projeto valem para todo mundo da equipe que usa o repositório.\u003c/p>", "Exemplos": "\u003cul>\n\u003cli>Liberar os scripts do npm e o commit, e proibir o push\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;permissions&quot;: {\n    &quot;allow&quot;: [&quot;Bash(npm run *)&quot;, &quot;Bash(git commit *)&quot;],\n    &quot;deny&quot;: [&quot;Bash(git push *)&quot;]\n  }\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Proibir a leitura de arquivos com segredos (a regra de \u003ccode>Read\u003c/code> vale também para \u003ccode>cat\u003c/code>, \u003ccode>head\u003c/code>, \u003ccode>tail\u003c/code> e outros comandos de arquivo no terminal)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;permissions&quot;: {\n    &quot;deny&quot;: [&quot;Read(./.env)&quot;, &quot;Read(./secrets/**)&quot;]\n  }\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Deixar um modo como padrão nas configurações: \u003ccode>\"defaultMode\": \"acceptEdits\"\u003c/code> dentro de \u003ccode>\"permissions\"\u003c/code>.\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>\u003ccode>bypassPermissions\u003c/code> e \u003ccode>--dangerously-skip-permissions\u003c/code> desligam quase todas as perguntas. A documentação recomenda usar \u003cstrong>só em container ou máquina virtual\u003c/strong>, onde o Claude não tem como causar estrago.\u003c/li>\n\u003cli>No app, o modo Bypass só aparece depois de ativar \"Allow bypass permissions mode\" em Settings &gt; Code (nos planos Team e Enterprise, quem decide é a organização).\u003c/li>\n\u003cli>Regras de \u003ccode>Bash\u003c/code> que tentam controlar os argumentos do comando são frágeis. A regra não reconhece o mesmo programa chamado por outro caminho ou dentro de \u003ccode>sh -c\u003c/code>. Para bloqueio de verdade, use \u003ccode>deny\u003c/code> na ferramenta inteira, um hook ou o sandbox.\u003c/li>\n\u003cli>Alguns comandos só de leitura (\u003ccode>ls\u003c/code>, \u003ccode>cat\u003c/code>, \u003ccode>grep\u003c/code>, \u003ccode>git status\u003c/code>...) rodam sem perguntar.\u003c/li>\n\u003cli>\u003ccode>deny\u003c/code> sempre vence: se uma regra libera e outra proíbe, a ação fica proibida.\u003c/li>\n\u003c/ul>"}}, {"slug": "plugins", "titulo": "Plugins", "tipo": "Claude Code", "objetivos": ["padronizar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Um pacote que reúne vários recursos para instalar de uma vez: skills, subagentes, hooks, servidores MCP e outros. O Claude Code instala e carrega tudo como uma unidade, e dá para ligar ou desligar o pacote inteiro.\u003c/p>\n\u003cp>Plugins vêm de \u003cstrong>marketplaces\u003c/strong>: um repositório com um catálogo (\u003ccode>.claude-plugin/marketplace.json\u003c/code>) que lista os plugins e de onde baixar cada um. É um catálogo, não uma loja verificada. As skills de um plugin são chamadas com o nome do plugin na frente: \u003ccode>/nome-do-plugin:nome-da-skill\u003c/code>.\u003c/p>", "Quando usar": "\u003cul>\n\u003cli>Para instalar de uma vez um conjunto pronto de recursos que alguém já montou (por exemplo, skills de marketing ou de engenharia).\u003c/li>\n\u003cli>Para \u003cstrong>padronizar o jeito de trabalhar de uma equipe\u003c/strong>: você monta um plugin com as skills, subagentes e hooks do time, e todos instalam o mesmo pacote.\u003c/li>\n\u003cli>Se é um recurso só (uma skill, um hook), um plugin é exagero: crie o recurso direto.\u003c/li>\n\u003c/ul>", "Exemplos": "\u003cul>\n\u003cli>Procurar e instalar pelo menu, dentro do Claude Code\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/plugin\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Instalar pelo terminal: primeiro o marketplace, depois o plugin\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude plugin marketplace add dono/repositorio\nclaude plugin install nome-do-plugin@nome-do-marketplace\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Desligar um plugin sem desinstalar\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude plugin disable nome-do-plugin\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Montar um plugin próprio com as skills e hooks que você já usa, para levar a outro computador ou compartilhar com a equipe\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>Um plugin instalado \u003cstrong>pode rodar código com as suas permissões\u003c/strong> (pelos hooks e scripts dele). Instale só de quem você confia e olhe o que ele traz.\u003c/li>\n\u003cli>Hooks de plugin rodam sozinhos, sem você chamar: vale saber quais vieram junto (aparecem em \u003ccode>/hooks\u003c/code>, no terminal).\u003c/li>\n\u003cli>Plugins grandes trazem muitas skills, e cada descrição ocupa um pouco do contexto. Desligue os que não usa.\u003c/li>\n\u003cli>O marketplace só aponta onde está o plugin; não garante qualidade.\u003c/li>\n\u003c/ul>"}}, {"slug": "sessoes-resume", "titulo": "Sessões e --resume", "tipo": "Claude Code", "objetivos": ["automatizar", "dividir", "organizar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Cada conversa com o Claude Code é uma \u003cstrong>sessão\u003c/strong>, e todas ficam salvas: as mensagens, as ferramentas usadas e os resultados. Com isso você fecha o app ou o terminal e depois volta exatamente de onde parou.\u003c/p>\n\u003cp>No app, as sessões ficam na barra lateral; clique numa para continuar. Para retomar uma sessão que você começou no terminal, digite \u003ccode>/resume\u003c/code> na caixa de mensagem. Para renomear, clique no título da sessão: com um bom nome, fica fácil achá-la depois.\u003c/p>\n\u003cp>No terminal:\n- \u003ccode>claude --continue\u003c/code> (ou \u003ccode>-c\u003c/code>): reabre a sessão mais recente da pasta atual.\n- \u003ccode>claude --resume\u003c/code> (ou \u003ccode>-r\u003c/code>): abre uma lista para você escolher a sessão. Com um nome, \u003ccode>claude --resume &lt;nome&gt;\u003c/code>, vai direto para ela.\n- \u003ccode>claude -n &lt;nome&gt;\u003c/code> dá nome à sessão ao abrir; \u003ccode>/rename &lt;nome&gt;\u003c/code> dá nome durante.\u003c/p>\n\u003cp>Ao voltar, o Claude retoma também o modelo e o modo de permissão que a sessão usava.\u003c/p>", "Quando usar": "\u003cul>\n\u003cli>\u003cstrong>Ao fim de cada sessão, peça um documento de retomada.\u003c/strong> Peça ao Claude para escrever num arquivo do projeto (ex.: \u003ccode>docs/proxima-sessao.md\u003c/code>) o que foi feito, o estado atual, as decisões tomadas e o próximo passo. Na sessão seguinte, o primeiro pedido é \"leia o \u003ccode>docs/proxima-sessao.md\u003c/code> e continue\". É mais seguro que o \u003ccode>--resume\u003c/code>: o documento não expira em 30 dias, vai para o git, qualquer pessoa da equipe pode ler, e a sessão nova começa limpa, só com o que importa. O \u003ccode>--resume\u003c/code> serve para voltar logo a uma conversa específica; o documento serve para o projeto não depender de nenhuma conversa.\u003c/li>\n\u003cli>Trabalho que dura vários dias: nomeie a sessão e volte a ela com \u003ccode>--resume\u003c/code>, sem explicar tudo de novo.\u003c/li>\n\u003cli>Testar um caminho diferente sem perder o atual (no terminal): \u003ccode>/branch\u003c/code> cria uma cópia da conversa até aquele ponto, e a original continua intacta.\u003c/li>\n\u003cli>Conversa longa demais: \u003ccode>/clear\u003c/code> começa do zero (a sessão anterior continua salva) e \u003ccode>/compact\u003c/code> troca o histórico por um resumo. Sessões curtas, uma por tarefa, rendem respostas melhores do que uma sessão enorme.\u003c/li>\n\u003c/ul>", "Exemplos": "\u003cul>\n\u003cli>Fechar a sessão deixando um documento de retomada\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">Antes de encerrar, atualize docs/proxima-sessao.md com:\n- o que fizemos hoje;\n- o estado atual (o que funciona, o que está pela metade);\n- as decisões tomadas e o porquê;\n- os próximos passos, em ordem;\n- os cuidados (o que não pode ser esquecido).\nNo topo, ponha a frase exata para eu colar na próxima sessão.\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>No terminal: criar uma cópia da conversa para testar outra solução (no app o \u003ccode>/branch\u003c/code> não funciona)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/branch tentativa-com-cache\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>No terminal: dar nome à sessão, voltar a ela e continuar a última\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">claude -n relatorio-vendas\n# no dia seguinte, na mesma pasta:\nclaude --resume relatorio-vendas\n# ou simplesmente continuar a última conversa da pasta:\nclaude -c\n# na lista do --resume: Espaço mostra uma prévia, Ctrl+R renomeia,\n# Ctrl+A mostra as sessões de todos os projetos e / busca\n\u003c/code>\u003c/pre>", "Limites e cuidados": "\u003cul>\n\u003cli>Voltar a uma sessão \u003cstrong>não desfaz\u003c/strong> as mudanças nos arquivos. Os arquivos ficam como estão no disco hoje, e o Claude pode lembrar de uma versão antiga deles.\u003c/li>\n\u003cli>As sessões ficam guardadas por \u003cstrong>30 dias\u003c/strong> (configurável com \u003ccode>cleanupPeriodDays\u003c/code> no \u003ccode>settings.json\u003c/code>), em \u003ccode>~/.claude/projects/\u003c/code>. Elas contêm tudo o que passou pela conversa, inclusive o conteúdo dos arquivos lidos.\u003c/li>\n\u003cli>No terminal, opções passadas ao abrir, como \u003ccode>--mcp-config\u003c/code>, \u003ccode>--settings\u003c/code> e \u003ccode>--add-dir\u003c/code>, não voltam sozinhas: passe de novo.\u003c/li>\n\u003cli>Sessões criadas com \u003ccode>claude -p\u003c/code> não aparecem na lista nem no \u003ccode>--continue\u003c/code>; volte a elas pelo ID (\u003ccode>claude --resume &lt;id&gt;\u003c/code>).\u003c/li>\n\u003cli>Sessões sem nome recebem um nome automático (ex.: \u003ccode>meu-app-3f\u003c/code>), mas esse nome \u003cstrong>não\u003c/strong> serve para o \u003ccode>--resume\u003c/code>.\u003c/li>\n\u003cli>O documento de retomada só vale se estiver atualizado. Leia antes de fechar a sessão e corrija o que o Claude tiver resumido errado. É ele que a próxima sessão vai seguir.\u003c/li>\n\u003cli>Dá para automatizar parte disso com um hook \u003ccode>SessionEnd\u003c/code>, que roda quando a sessão termina. Ele pode salvar sozinho um resumo básico (últimos pedidos, commits, arquivos alterados) para a próxima sessão ler. Esse resumo automático não substitui o documento escrito pelo Claude: ele registra o que aconteceu, mas não as decisões nem o porquê.\u003c/li>\n\u003c/ul>"}}, {"slug": "skills", "titulo": "Skills", "tipo": "Claude Code", "objetivos": ["padronizar", "automatizar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Uma pasta com um arquivo \u003ccode>SKILL.md\u003c/code> que ensina o Claude a fazer um tipo de tarefa do seu jeito: passos, regras, modelos, exemplos. A pasta pode ter arquivos de apoio (modelos, scripts).\u003c/p>\n\u003cp>O Claude usa a skill \u003cstrong>sozinho\u003c/strong> quando o pedido combina com a \u003ccode>description\u003c/code>, ou você a chama pelo nome com \u003ccode>/nome-da-skill\u003c/code>. Só a descrição fica sempre no contexto; o conteúdo completo só é carregado quando a skill é usada.\u003c/p>\n\u003cp>Onde ficam: \u003ccode>~/.claude/skills/&lt;nome&gt;/SKILL.md\u003c/code> vale para todos os projetos; \u003ccode>.claude/skills/&lt;nome&gt;/SKILL.md\u003c/code> vale só para um projeto; plugins também trazem skills. Os antigos comandos em \u003ccode>.claude/commands/\u003c/code> continuam funcionando e viraram skills.\u003c/p>", "Quando usar": "\u003cp>Quando você se pega repetindo as mesmas instruções: o formato de um relatório, o passo a passo de uma revisão, o jeito de escrever um e-mail para cliente. Em vez de explicar de novo a cada conversa, escreva uma vez numa skill. Se algo precisa acontecer \u003cstrong>sempre\u003c/strong>, sem depender do Claude, use um hook.\u003c/p>", "Exemplos": "\u003cul>\n\u003cli>Criar uma skill pessoal (arquivo \u003ccode>~/.claude/skills/relatorio-semanal/SKILL.md\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-markdown\">---\nname: relatorio-semanal\ndescription: Monta o relatório semanal de atividades. Use quando eu pedir o\n  relatório da semana ou um resumo do que foi feito.\n---\n1. Pergunte o período, se eu não disser.\n2. Agrupe por projeto: feito, em andamento, bloqueado.\n3. Termine com os 3 próximos passos mais importantes.\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Chamar a skill pelo nome\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/relatorio-semanal\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Fazer uma skill que só roda quando você chama (nunca sozinha), útil para ações com efeito, como publicar ou enviar algo\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-markdown\">---\nname: publicar\ndescription: Publica a versão atual do site.\ndisable-model-invocation: true\n---\n\u003c/code>\u003c/pre>", "Limites e cuidados": "\u003cul>\n\u003cli>A \u003ccode>description\u003c/code> é o que faz a skill ser usada: vaga demais, o Claude não a escolhe; ampla demais, ela aparece onde não devia.\u003c/li>\n\u003cli>Cada skill instalada ocupa um pouco da janela de contexto com a descrição. Muitas skills = menos espaço para o trabalho. (As que têm \u003ccode>disable-model-invocation: true\u003c/code> não ocupam.)\u003c/li>\n\u003cli>Skill é instrução, não garantia: o Claude pode interpretá-la mal. Para regra obrigatória, use hook.\u003c/li>\n\u003cli>Skills que vêm dentro de um repositório podem liberar ferramentas para si mesmas (\u003ccode>allowed-tools\u003c/code>). Revise antes de rodar o Claude Code numa pasta de terceiros.\u003c/li>\n\u003c/ul>"}}, {"slug": "verification-skills", "titulo": "Skills de verificação", "tipo": "Métodos", "objetivos": ["verificar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Uma skill que \u003cstrong>confere o trabalho do Claude sozinha\u003c/strong>, sem você precisar lembrar de pedir. Normalmente, quando o Claude termina uma mudança, é você quem tem que lembrar de rodar os testes ou ler o diff. Se esquecer uma vez, o erro passa.\u003c/p>\n\u003cp>Com uma skill de verificação, a mudança combina com a \u003ccode>description\u003c/code> da skill, e ela dispara sozinha. A partir daí segue sempre os mesmos passos:\n1. Roda os testes.\n2. Lê o diff.\n3. Confere se \u003cstrong>nenhum teste foi afrouxado\u003c/strong> só para passar.\n4. Informa \"passou\" ou \"falhou\", com a evidência junto.\u003c/p>\n\u003cp>O passo 3 é o mais importante: ver tudo verde não basta, porque um teste pode ser alterado para passar de qualquer jeito. \"Pronto\" não é \"o código parece certo\". Pronto é cada checagem rodada e observada, com o resultado dito com clareza.\u003c/p>", "Quando usar": "\u003cp>É a primeira skill que vale construir num projeto com código. A mesma estrutura serve para qualquer procedimento que a equipe repete: checklist de release, receita de migração, conferência antes de abrir um pull request. A regra prática: \u003cstrong>se você digitou a mesma instrução de vários passos duas vezes, isso é uma skill.\u003c/strong>\u003c/p>\n\u003cp>Guarde a skill em \u003ccode>.claude/skills/\u003c/code> do projeto e ponha no git: a equipe inteira passa a conferir o trabalho do mesmo jeito, sem ninguém precisar lembrar.\u003c/p>\n\u003cp>Para saber onde cada regra deve ficar:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tipo de regra\u003c/th>\n\u003cth>Onde fica\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Convenção que vale sempre (nomes, onde ficam os arquivos)\u003c/td>\n\u003ctd>\u003ccode>CLAUDE.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Procedimento ou material de um tipo de tarefa\u003c/td>\n\u003ctd>Skill\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Regra que o Claude \u003cstrong>não pode\u003c/strong> pular\u003c/td>\n\u003ctd>Hook\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>", "Exemplos": "\u003cul>\n\u003cli>Uma skill de verificação (arquivo \u003ccode>.claude/skills/verificar-mudanca/SKILL.md\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-markdown\">---\nname: verificar-mudanca\ndescription: Verifica uma mudança de código antes de dar a tarefa por\n  concluída. Use depois de qualquer refatoração, correção de bug ou\n  funcionalidade nova.\n---\n1. Rode o script check.sh desta pasta e guarde a saída.\n2. Leia o diff completo (git diff).\n3. Confira se algum teste foi afrouxado: asserção removida, teste\n   pulado ou valor esperado trocado para bater com o resultado.\n   Os casos estão detalhados em reference.md.\n4. Responda APROVADO ou REPROVADO, mostrando a saída dos testes e os\n   trechos do diff que comprovam.\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>A pasta pode levar mais do que o \u003ccode>SKILL.md\u003c/code>: um \u003ccode>reference.md\u003c/code> com o material detalhado (o Claude só lê quando precisa) e scripts que ele \u003cstrong>executa\u003c/strong> sem carregar o conteúdo no contexto\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">.claude/skills/verificar-mudanca/\n├── SKILL.md       ← curto: o que fazer\n├── reference.md   ← detalhes: o que conta como teste afrouxado\n└── check.sh       ← roda todas as checagens\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>O script com as checagens (troque pelos comandos do seu projeto)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">#!/usr/bin/env bash\nset -e\nnpm test\nnpm run lint\n\u003c/code>\u003c/pre>", "Limites e cuidados": "\u003cul>\n\u003cli>Mantenha o \u003ccode>SKILL.md\u003c/code> \u003cstrong>enxuto\u003c/strong>. Explicação longa vai para o \u003ccode>reference.md\u003c/code>, e o que é executável vai para scripts.\u003c/li>\n\u003cli>A skill é instrução: ela dispara quando o Claude reconhece que a \u003ccode>description\u003c/code> combina com o momento. Se a verificação \u003cstrong>não pode\u003c/strong> ser pulada em hipótese nenhuma, use um hook (por exemplo, no evento \u003ccode>Stop\u003c/code>), porque o hook é código que roda sempre.\u003c/li>\n\u003cli>Uma verificação que só \"lê o código e acha que está certo\" não vale. Exija que a skill rode as checagens e mostre a saída.\u003c/li>\n\u003c/ul>"}}, {"slug": "subagentes", "titulo": "Subagentes", "tipo": "Claude Code", "objetivos": ["dividir", "verificar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Assistentes especializados que o Claude chama para cuidar de uma parte do trabalho. Cada subagente roda com a \u003cstrong>própria janela de contexto\u003c/strong>, as próprias instruções, as próprias ferramentas e permissões. Ele trabalha separado e devolve só o resultado, então a conversa principal não se enche de detalhes.\u003c/p>\n\u003cp>Cada um é um arquivo \u003ccode>.md\u003c/code> com um cabeçalho (frontmatter): \u003ccode>~/.claude/agents/\u003c/code> vale para todos os projetos; \u003ccode>.claude/agents/\u003c/code> vale só para um projeto; plugins também trazem subagentes. Os campos obrigatórios são \u003ccode>name\u003c/code> e \u003ccode>description\u003c/code>. O Claude Code já vem com alguns prontos, como \u003ccode>Explore\u003c/code> (procura no código) e \u003ccode>Plan\u003c/code> (planeja).\u003c/p>", "Quando usar": "\u003cul>\n\u003cli>Para tarefas que geram muita \"sujeira\" de contexto e só importa a conclusão: pesquisar, varrer muitos arquivos, ler logs.\u003c/li>\n\u003cli>Para uma segunda opinião independente: revisar código ou texto com outros olhos, sem o viés da conversa.\u003c/li>\n\u003cli>Para dividir trabalho grande em partes que podem andar em paralelo.\u003c/li>\n\u003c/ul>\n\u003cp>O Claude escolhe sozinho qual subagente chamar comparando o pedido com a \u003ccode>description\u003c/code>; você também pode pedir pelo nome ou mencioná-lo com \u003ccode>@\u003c/code>.\u003c/p>", "Exemplos": "\u003cul>\n\u003cli>Criar um subagente revisor (arquivo \u003ccode>~/.claude/agents/revisor.md\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-markdown\">---\nname: revisor\ndescription: Revisa mudanças de código antes do commit, procurando bugs e\n  falta de teste. Use antes de commitar.\ntools: Read, Grep, Glob, Bash\nmodel: sonnet\n---\nVocê revisa código. Leia o git diff, aponte bugs reais com arquivo e linha,\ne não altere nenhum arquivo.\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Chamar um subagente pelo nome\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">Use o subagente revisor para revisar as mudanças desta etapa.\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Pedir uma pesquisa em paralelo: \"Pesquise estes três concorrentes, um subagente para cada, e me traga um resumo comparando os três.\"\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>O subagente \u003cstrong>não vê a conversa principal\u003c/strong>: tudo o que ele precisa saber tem de estar no pedido que recebe.\u003c/li>\n\u003cli>Cada subagente tem o próprio contexto, então \u003cstrong>gasta mais tokens\u003c/strong> no total do que fazer tudo numa conversa só.\u003c/li>\n\u003cli>Ele devolve um resumo: detalhes do caminho se perdem. Para coisas importantes, peça que cite arquivos e linhas.\u003c/li>\n\u003cli>Se \u003ccode>tools\u003c/code> ficar em branco, ele \u003cstrong>herda todas as ferramentas\u003c/strong>. Para um revisor que só lê, liste só as de leitura.\u003c/li>\n\u003cli>Uma \u003ccode>description\u003c/code> vaga faz o Claude nunca escolher o subagente sozinho.\u003c/li>\n\u003c/ul>"}}, {"slug": "tarefas-agendadas", "titulo": "Tarefas agendadas e rotinas", "tipo": "Claude Code", "objetivos": ["automatizar"], "rascunho": false, "atualizado": "2026-11-05", "secoes": {"O que é": "\u003cp>Pedidos que o Claude executa \u003cstrong>sozinho\u003c/strong>, num horário marcado ou repetindo de tempos em tempos. Existem três formas, e a diferença é \u003cstrong>onde\u003c/strong> a tarefa roda:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Tarefa do app\u003c/th>\n\u003cth>Tarefa na nuvem (rotina)\u003c/th>\n\u003cth>\u003ccode>/loop\u003c/code>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Onde roda\u003c/td>\n\u003ctd>No seu computador\u003c/td>\n\u003ctd>Nos servidores da Anthropic\u003c/td>\n\u003ctd>No seu computador, dentro da sessão aberta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Computador precisa estar ligado?\u003c/td>\n\u003ctd>Sim, com o app aberto\u003c/td>\n\u003ctd>Não\u003c/td>\n\u003ctd>Sim, com a sessão aberta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Vê seus arquivos locais?\u003c/td>\n\u003ctd>Sim\u003c/td>\n\u003ctd>Não: trabalha numa cópia nova do repositório do GitHub\u003c/td>\n\u003ctd>Sim\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Intervalo mínimo\u003c/td>\n\u003ctd>1 hora pelo formulário\u003c/td>\n\u003ctd>1 hora\u003c/td>\n\u003ctd>1 minuto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dura até\u003c/td>\n\u003ctd>Você apagar\u003c/td>\n\u003ctd>Você apagar\u003c/td>\n\u003ctd>7 dias, ou até fechar a sessão\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>No app\u003c/strong>, as duas primeiras se criam pelo menu \u003cstrong>Scheduled\u003c/strong> (ou \u003cstrong>Routines\u003c/strong>) da barra lateral, com \u003cstrong>New task\u003c/strong>. Você dá um nome, escreve as instruções, escolhe a pasta e o horário: de hora em hora, todo dia, só nos dias úteis, toda semana, manual ou uma expressão cron. Pode escolher também o modo de permissão e o modelo de cada tarefa. A tarefa na nuvem pode disparar também por um evento do GitHub (um pull request aberto, por exemplo) ou por uma chamada de API.\u003c/p>\n\u003cp>O \u003cstrong>\u003ccode>/loop\u003c/code>\u003c/strong> se digita na caixa de mensagem: ele repete um pedido enquanto a sessão estiver aberta.\u003c/p>", "Quando usar": "\u003cul>\n\u003cli>\u003cstrong>Tarefa do app:\u003c/strong> rotinas que precisam dos seus arquivos, como um resumo do dia às 9h, a revisão das dependências toda segunda ou a organização de uma pasta de relatórios.\u003c/li>\n\u003cli>\u003cstrong>Tarefa na nuvem:\u003c/strong> o que precisa rodar mesmo com o computador desligado, como revisar todo pull request novo de um repositório ou fazer uma checagem noturna.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>/loop\u003c/code>:\u003c/strong> acompanhar algo durante a sessão, como \"avise quando o deploy terminar\" ou \"veja de 10 em 10 minutos se o CI passou\".\u003c/li>\n\u003c/ul>", "Exemplos": "\u003cul>\n\u003cli>Acompanhar o deploy durante a sessão, a cada 5 minutos\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/loop 5m veja se o deploy terminou e me conte o que aconteceu\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Deixar o Claude escolher o ritmo da verificação\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/loop veja se o CI passou e corrija os comentários da revisão\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\n\u003cp>Pedir em linguagem natural, dentro da sessão: \"que tarefas agendadas eu tenho?\" ou \"cancele a verificação do deploy\".\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>Criar uma tarefa na nuvem de dentro da sessão (abre uma conversa para configurar)\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">/schedule revisão diária dos pull requests às 9h\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Na primeira vez, clique em \u003cstrong>Run now\u003c/strong> na tarefa do app e escolha \"always allow\" para cada permissão pedida. Assim as próximas execuções não ficam travadas esperando você.\u003c/li>\n\u003c/ul>", "Limites e cuidados": "\u003cul>\n\u003cli>\u003cstrong>Tarefa do app:\u003c/strong> só roda com o app aberto e o computador acordado. Se o computador dormir no horário, a execução é pulada. Quando ele acorda, o app faz \u003cstrong>uma\u003c/strong> execução para recuperar a mais recente perdida e descarta as mais antigas. Fechar a tampa do notebook o põe para dormir.\u003c/li>\n\u003cli>\u003cstrong>Permissões:\u003c/strong> no modo Manual, a tarefa do app \u003cstrong>trava\u003c/strong> esperando aprovação. A tarefa na nuvem roda no modo \u003ccode>auto\u003c/code>. O \u003ccode>/loop\u003c/code> usa as permissões da própria sessão.\u003c/li>\n\u003cli>\u003cstrong>A tarefa na nuvem age em seu nome:\u003c/strong> commits, pull requests e mensagens enviadas pelos conectores saem com a sua conta. Comece com tarefas que só leem e relatam.\u003c/li>\n\u003cli>\u003cstrong>Horário aproximado:\u003c/strong> para espalhar a carga, as tarefas podem rodar alguns minutos depois do horário marcado. Uma tarefa de hora em hora pode atrasar até 30 minutos.\u003c/li>\n\u003cli>\u003cstrong>Custo:\u003c/strong> cada execução gasta o seu limite de uso. Um \u003ccode>/loop\u003c/code> de 1 em 1 minuto ou uma tarefa de hora em hora somam rápido.\u003c/li>\n\u003cli>O \u003ccode>/loop\u003c/code> para quando a sessão fecha. As repetições expiram em 7 dias, e cada sessão aceita no máximo 50 tarefas.\u003c/li>\n\u003cli>As tarefas na nuvem estão em fase de teste (\"research preview\"): o funcionamento e os limites podem mudar.\u003c/li>\n\u003c/ul>"}}], "glossario": [{"termo": "CI (integração contínua)", "html": "\u003cp>Um robô que roda tarefas sozinho toda vez que alguém envia uma mudança de código para o repositório: testes, verificações, publicação. Exemplo: o GitHub Actions. Com o Claude Code, dá para colocar o Claude nesse robô, por exemplo para revisar cada mudança.\u003c/p>"}, {"termo": "Conector", "html": "\u003cp>Uma ligação pronta entre o Claude e um serviço que você já usa, como Google Agenda, Drive, Gmail ou Perplexity. Você autoriza uma vez, na sua conta do claude.ai, e o Claude passa a poder ler e agir nesse serviço dentro dos limites dele. Por baixo, os conectores costumam funcionar com MCP.\u003c/p>"}, {"termo": "Headless (modo sem interface)", "html": "\u003cp>Rodar o Claude Code sem a tela de conversa: ele recebe a instrução, executa, mostra o resultado e termina. O comando é \u003ccode>claude -p \"...\"\u003c/code>. Serve para scripts, tarefas agendadas e CI. Como não há ninguém para responder a pedidos de permissão, o que ele pode fazer precisa ser liberado antes.\u003c/p>"}, {"termo": "Hook", "html": "\u003cp>Um comando que o \u003cstrong>próprio programa\u003c/strong> roda automaticamente em momentos fixos: antes ou depois de o Claude usar uma ferramenta, no início da sessão, quando ele termina de responder. A diferença para \"pedir ao Claude\": o hook sempre roda, não depende de o Claude lembrar.\u003c/p>"}, {"termo": "Janela de contexto", "html": "\u003cp>A \"memória de trabalho\" do modelo numa conversa: tudo o que ele consegue considerar de uma vez, contando suas mensagens, as respostas, os arquivos lidos e as instruções. Ela é \u003cstrong>limitada\u003c/strong>. Quando uma sessão fica muito longa, o Claude começa a perder detalhes do início, fica mais lento e gasta mais. Ao se aproximar do limite, o Claude Code resume a conversa automaticamente, e parte dos detalhes se perde nesse resumo.\u003c/p>\n\u003cp>\u003cstrong>Dica:\u003c/strong> divida o trabalho em \u003cstrong>várias sessões curtas\u003c/strong>, uma por etapa ou assunto, em vez de uma sessão enorme. Ao terminar uma etapa, peça um resumo do que foi feito e do que falta (um documento de passagem) e comece uma sessão nova a partir dele. No Claude Code, \u003ccode>/clear\u003c/code> começa uma conversa limpa e \u003ccode>/compact\u003c/code> resume a atual para liberar espaço.\u003c/p>"}, {"termo": "MCP (Model Context Protocol)", "html": "\u003cp>Um padrão aberto que liga modelos de IA a ferramentas e dados externos, como uma \"tomada universal\". Quem cria um servidor MCP para um sistema (um banco de dados, uma API) permite que qualquer aplicativo compatível com MCP, como o Claude, use esse sistema.\u003c/p>"}, {"termo": "Modelo (Opus, Sonnet, Haiku)", "html": "\u003cp>O \"cérebro\" de IA que responde. A Anthropic oferece três tamanhos, e no Claude dá para escolher qual usar:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Opus\u003c/strong>: o mais capaz, para tarefas difíceis (raciocínio longo, código complexo, análises). É mais lento e gasta mais do seu limite de uso.\u003c/li>\n\u003cli>\u003cstrong>Sonnet\u003c/strong>: o equilíbrio entre qualidade e velocidade. Bom padrão para a maior parte do trabalho.\u003c/li>\n\u003cli>\u003cstrong>Haiku\u003c/strong>: o mais rápido e econômico, para tarefas simples e repetitivas (resumir, classificar, respostas curtas).\u003c/li>\n\u003c/ul>\n\u003cp>Regra prática: comece no Sonnet, suba para o Opus quando a tarefa for difícil e use o Haiku quando for simples e em grande volume.\u003c/p>"}, {"termo": "Plugin", "html": "\u003cp>Um pacote que reúne vários recursos para instalar de uma vez: skills, subagentes, hooks e às vezes servidores MCP. Serve para reaproveitar e compartilhar um jeito de trabalhar, por exemplo com a equipe.\u003c/p>"}, {"termo": "Prompt de sistema", "html": "\u003cp>As instruções de base que o modelo recebe antes da conversa e que valem para ela inteira: quem ele é, regras, tom. O usuário normalmente não vê. No Claude Code, o \u003ccode>CLAUDE.md\u003c/code> funciona de forma parecida para um projeto.\u003c/p>"}, {"termo": "SDK (kit de desenvolvimento)", "html": "\u003cp>Uma \"caixa de peças\" de programação que uma empresa oferece para que \u003cstrong>programadores\u003c/strong> usem o serviço dela dentro dos próprios programas. Em vez de você conversar com o Claude numa tela, o \u003cstrong>seu programa\u003c/strong> conversa com ele. Exemplo: o \u003cstrong>Agent SDK\u003c/strong> permite criar um sistema próprio que, sozinho, lê os e-mails de suporte, consulta uma planilha e escreve a resposta, usando o mesmo \"motor\" do Claude Code. Só faz sentido para quem vai programar. Para o uso do dia a dia, não é necessário.\u003c/p>"}, {"termo": "Sessão", "html": "\u003cp>Uma conversa contínua com o Claude Code, com todo o histórico e o contexto dela. Cada sessão tem um identificador, e dá para retomá-la depois (\u003ccode>claude --resume\u003c/code>) sem perder o que já foi feito.\u003c/p>"}, {"termo": "Skill", "html": "\u003cp>Uma pasta com instruções (um arquivo \u003ccode>SKILL.md\u003c/code>) que ensina o Claude a fazer um tipo de tarefa de um jeito específico. O Claude lê a descrição e usa a skill quando ela combina com o pedido, ou quando você a chama pelo nome com \u003ccode>/nome\u003c/code>.\u003c/p>"}, {"termo": "Subagente", "html": "\u003cp>Um \"ajudante\" que o Claude chama para cuidar de uma parte do trabalho, com instruções, ferramentas e contexto próprios, como pesquisar na web ou revisar código. Ele trabalha separado e devolve só o resultado, o que mantém a conversa principal enxuta.\u003c/p>"}, {"termo": "Token", "html": "\u003cp>A unidade em que a IA lê e escreve texto: pedaços de palavras. Uma palavra em português costuma virar um ou mais tokens. Limites de tamanho e custos são contados em tokens.\u003c/p>"}], "cola": [{"grupo": "Abrir e retomar (terminal)", "html": "\u003cp>No app: retome uma sessão clicando nela na barra lateral (ou com \u003ccode>/resume\u003c/code>), renomeie clicando no título e troque o modelo no seletor abaixo da caixa de mensagem.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Comando\u003c/th>\n\u003cth>O que faz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>claude\u003c/code>\u003c/td>\n\u003ctd>Abre uma sessão interativa na pasta atual\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>claude \"pedido\"\u003c/code>\u003c/td>\n\u003ctd>Abre a sessão já com um pedido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>claude -c\u003c/code>\u003c/td>\n\u003ctd>Continua a conversa mais recente desta pasta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>claude -r\u003c/code>\u003c/td>\n\u003ctd>Mostra as sessões anteriores para escolher qual retomar (aceita também ID ou nome)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>claude -n \"nome\"\u003c/code>\u003c/td>\n\u003ctd>Dá um nome à sessão, para achá-la depois\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>claude --model opus\u003c/code>\u003c/td>\n\u003ctd>Escolhe o modelo da sessão (\u003ccode>opus\u003c/code>, \u003ccode>sonnet\u003c/code>...)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}, {"grupo": "Automação (sem interface)", "html": "\u003cp>Só no terminal: o app não tem modo sem interface.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Comando\u003c/th>\n\u003cth>O que faz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>claude -p \"pedido\"\u003c/code>\u003c/td>\n\u003ctd>Modo headless: executa, imprime a resposta e termina\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--output-format json\u003c/code>\u003c/td>\n\u003ctd>Saída em JSON, com o \u003ccode>session_id\u003c/code> para retomar depois (só com \u003ccode>-p\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--allowedTools \"Bash(git *) Edit\"\u003c/code>\u003c/td>\n\u003ctd>Libera essas ferramentas sem pedir permissão\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--permission-mode plan\u003c/code>\u003c/td>\n\u003ctd>Escolhe o modo de permissão (\u003ccode>plan\u003c/code>, \u003ccode>acceptEdits\u003c/code>, \u003ccode>manual\u003c/code>...)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--bare\u003c/code>\u003c/td>\n\u003ctd>Modo mínimo para CI: sem hooks, plugins nem \u003ccode>CLAUDE.md\u003c/code>; exige \u003ccode>ANTHROPIC_API_KEY\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--max-budget-usd 2\u003c/code>\u003c/td>\n\u003ctd>Teto de gasto em dólares (para quem usa chave de API)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}, {"grupo": "Dentro da sessão: contexto e histórico", "html": "\u003cp>Digite na caixa de mensagem, no app ou no terminal.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Comando\u003c/th>\n\u003cth>O que faz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/clear\u003c/code>\u003c/td>\n\u003ctd>Começa uma conversa nova, com o contexto vazio\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/compact\u003c/code>\u003c/td>\n\u003ctd>Resume a conversa para liberar espaço; aceita instruções sobre o que manter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/context\u003c/code>\u003c/td>\n\u003ctd>Mostra o que está ocupando a janela de contexto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/resume\u003c/code>\u003c/td>\n\u003ctd>Retoma outra conversa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/rewind\u003c/code>\u003c/td>\n\u003ctd>Volta a conversa e/ou o código a um ponto anterior\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/btw\u003c/code>\u003c/td>\n\u003ctd>Pergunta paralela que não entra no histórico da conversa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/model\u003c/code>\u003c/td>\n\u003ctd>Troca o modelo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/effort\u003c/code>\u003c/td>\n\u003ctd>Ajusta o nível de esforço (quanto o modelo \"pensa\")\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/help\u003c/code>\u003c/td>\n\u003ctd>Mostra a ajuda e os comandos disponíveis (no terminal; no app, abre a página de suporte)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}, {"grupo": "Dentro da sessão: configurar recursos", "html": "\u003cp>No app, os comandos que abrem um painel (como \u003ccode>/permissions\u003c/code> e \u003ccode>/hooks\u003c/code>) respondem que não estão disponíveis. Lá, edite os arquivos de configuração ou peça ao Claude para editar.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Comando\u003c/th>\n\u003cth>O que faz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/init\u003c/code>\u003c/td>\n\u003ctd>Cria um \u003ccode>CLAUDE.md\u003c/code> para o projeto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/memory\u003c/code>\u003c/td>\n\u003ctd>Edita os \u003ccode>CLAUDE.md\u003c/code> e a memória automática\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/permissions\u003c/code>\u003c/td>\n\u003ctd>Gerencia o que o Claude pode fazer sem pedir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/hooks\u003c/code>\u003c/td>\n\u003ctd>Mostra os hooks configurados\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/agents\u003c/code>\u003c/td>\n\u003ctd>Ajuda a criar ou gerenciar subagentes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/mcp\u003c/code>\u003c/td>\n\u003ctd>Gerencia os servidores MCP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/plugin\u003c/code>\u003c/td>\n\u003ctd>Instala, ativa e lista plugins\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}]}</script>
<script>
const KIT = JSON.parse(document.getElementById("kit-data").textContent);
const PESSOAL = {};  // preenchido só na versão pessoal
</script>

<script>
const FICHA = Object.fromEntries(KIT.fichas.map(f => [f.slug, f]));
const OBJETIVO = Object.fromEntries(KIT.objetivos.map(o => [o.id, o.nome]));
const estado = { modo: "recurso", termo: "", atual: null };
const $ = id => document.getElementById(id);

function semAcento(s) { return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function textoDe(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; }
const TEXTO = Object.fromEntries(KIT.fichas.map(f => [f.slug, semAcento(f.titulo + " " + Object.values(f.secoes).map(textoDe).join(" "))]));

function slugAtual() { const m = location.hash.match(/^#\/ficha\/([a-z0-9-]+)$/); return m ? m[1] : null; }

function renderMenu() {
  const palavras = estado.termo.split(/\s+/).filter(Boolean);
  const fichas = KIT.fichas.filter(f => palavras.every(p => TEXTO[f.slug].includes(p)));
  $("contagem").textContent = estado.termo ? (fichas.length ? `${fichas.length} resultado${fichas.length > 1 ? "s" : ""}` : "Nada encontrado") : "";
  const grupos = [];
  if (estado.modo === "recurso") {
    const tipos = [...new Set(fichas.map(f => f.tipo))].sort((a, b) => a.localeCompare(b, "pt-BR"));
    for (const t of tipos) grupos.push([t, fichas.filter(f => f.tipo === t)]);
  } else {
    for (const o of KIT.objetivos) {
      const doObj = fichas.filter(f => f.objetivos.includes(o.id));
      if (doObj.length) grupos.push([o.nome, doObj]);
    }
  }
  $("menu").innerHTML = grupos.length ? grupos.map(([nome, fs]) =>
    `<div class="grupo">${esc(nome)}</div><ul>${fs.map(f =>
      `<li><a class="item" href="#/ficha/${f.slug}"${f.slug === estado.atual ? ' aria-current="page"' : ""}>${esc(f.titulo)}</a></li>`).join("")}</ul>`).join("")
    : `<p class="vazio">${KIT.fichas.length ? "Nada encontrado." : "Nenhuma ficha ainda."}</p>`;
}

function blocoCodigo(pre, escondido) {
  const caixa = document.createElement("div");
  caixa.className = "bloco-codigo";
  caixa.hidden = escondido;
  const botao = document.createElement("button");
  botao.type = "button"; botao.className = "copiar"; botao.textContent = "Copiar";
  botao.addEventListener("click", () => copiar(pre.textContent, botao));
  caixa.append(pre, botao);
  return caixa;
}

function montarExemplos(html) {
  // Cada item de lista é um exemplo; um bloco de código logo depois pertence ao item anterior.
  const fonte = document.createElement("div");
  fonte.innerHTML = html;
  const saida = document.createElement("div");
  let ultimo = null;
  for (const el of [...fonte.children]) {
    if (el.tagName === "UL" || el.tagName === "OL") {
      for (const li of el.children) {
        const ex = document.createElement("div");
        ex.className = "ex";
        const linha = document.createElement("div");
        linha.className = "ex-linha";
        const texto = document.createElement("div");
        const pres = [...li.querySelectorAll("pre")];
        pres.forEach(p => p.remove());
        texto.innerHTML = li.innerHTML;
        linha.append(texto);
        ex.append(linha);
        saida.append(ex);
        ultimo = ex;
        pres.forEach(p => anexarCodigo(ex, p));
      }
    } else if (el.tagName === "PRE" && ultimo) {
      anexarCodigo(ultimo, el);
    } else if (el.tagName === "PRE") {
      saida.append(blocoCodigo(el, false));
    } else {
      saida.append(el);
      ultimo = null;
    }
  }
  return saida;
}

function anexarCodigo(ex, pre) {
  const caixa = blocoCodigo(pre, true);
  ex.append(caixa);
  if (ex.querySelector(".ver")) return;  // um botão por exemplo abre todos os blocos dele
  const ver = document.createElement("button");
  ver.type = "button"; ver.className = "ver"; ver.textContent = "Ver código";
  ver.setAttribute("aria-expanded", "false");
  ver.addEventListener("click", () => {
    const abrir = ver.getAttribute("aria-expanded") !== "true";
    ex.querySelectorAll(".bloco-codigo").forEach(c => { c.hidden = !abrir; });
    ver.setAttribute("aria-expanded", abrir);
    ver.textContent = abrir ? "Esconder código" : "Ver código";
  });
  ex.querySelector(".ex-linha").append(ver);
}

function codigoComCopiar(raiz) {
  raiz.querySelectorAll("pre").forEach(pre => {
    if (pre.closest(".bloco-codigo")) return;
    const lugar = document.createElement("span");
    pre.replaceWith(lugar);
    lugar.replaceWith(blocoCodigo(pre, false));
  });
}

function renderFicha(slug) {
  const f = FICHA[slug];
  if (!f) { $("conteudo").innerHTML = "<h1>Ficha não encontrada</h1><p>Escolha uma ficha no menu.</p>"; document.title = "Ficha não encontrada · Kit IA"; return; }
  const m = $("conteudo");
  m.innerHTML = `<h1>${esc(f.titulo)}</h1>
    <div class="tags"><span>${esc(f.tipo)}</span>${f.objetivos.map(o => `<span class="obj">${esc(OBJETIVO[o] ? OBJETIVO[o].split(" ")[0] : o)}</span>`).join("")}</div>
    ${f.rascunho ? '<div class="rascunho">Rascunho: conteúdo não verificado</div>' : ""}`;
  for (const [titulo, html] of Object.entries(f.secoes)) {
    const h = document.createElement("h2");
    h.textContent = titulo;
    m.append(h);
    if (titulo === "Exemplos") {
      m.append(montarExemplos(html));
    } else {
      const d = document.createElement("div");
      d.innerHTML = html;
      codigoComCopiar(d);
      m.append(d);
    }
  }
  if (PESSOAL.aposFicha) m.insertAdjacentHTML("beforeend", PESSOAL.aposFicha(f));
  m.insertAdjacentHTML("beforeend", `<p class="atualizado">Atualizado em ${f.atualizado.split("-").reverse().join("/")}</p>`);
  document.title = `${f.titulo} · Kit IA`;
}

function renderGlossario() {
  $("conteudo").innerHTML = "<h1>Glossário</h1>" + (KIT.glossario.length
    ? KIT.glossario.map(t => `<h2>${esc(t.termo)}</h2>${t.html}`).join("") : "<p>(em construção)</p>");
  codigoComCopiar($("conteudo"));
  document.title = "Glossário · Kit IA";
}

function renderCola() {
  $("conteudo").innerHTML = "<h1>Cola rápida</h1>" + (KIT.cola.length
    ? KIT.cola.map(g => `<h2>${esc(g.grupo)}</h2>${g.html}`).join("") : "<p>(em construção)</p>");
  codigoComCopiar($("conteudo"));
  document.title = "Cola rápida · Kit IA";
}

function rotear() {
  const h = location.hash;
  const veioDeLink = document.activeElement && document.activeElement.closest && document.activeElement.closest("#lado, .abas, main");
  let aba = "fichas";
  estado.atual = null;
  if (h === "#/glossario") { aba = "glossario"; renderGlossario(); }
  else if (h === "#/cola") { aba = "cola"; renderCola(); }
  else if (PESSOAL.rota && PESSOAL.rota(h)) aba = "meus";
  else if (slugAtual() || KIT.fichas.length) { estado.atual = slugAtual() || KIT.fichas[0].slug; renderFicha(estado.atual); }
  else { $("conteudo").innerHTML = "<h1>Kit IA</h1><p>Nenhuma ficha ainda. Crie arquivos em <code>recursos/</code> e rode o gerador.</p>"; }
  document.querySelectorAll(".abas a").forEach(a => {
    if (a.dataset.aba === aba) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  renderMenu();
  fecharMenu(false);
  $("principal").scrollTop = 0;
  if (veioDeLink) $("conteudo").focus({ preventScroll: true });
}

function copiar(texto, botao) {
  const mostrar = msg => { botao.textContent = msg; setTimeout(() => { botao.textContent = "Copiar"; }, 1500); };
  const avisar = () => mostrar("Copiado!");
  const planoB = () => {
    const t = document.createElement("textarea");
    t.value = texto; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.append(t); t.select();
    try { if (document.execCommand("copy")) avisar(); else mostrar("Não copiou"); } catch { mostrar("Não copiou"); } finally { t.remove(); }
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(avisar, planoB);
  else planoB();
}

function abrirMenu(abrir) {
  $("lado").classList.toggle("aberto", abrir);
  $("botao-menu").setAttribute("aria-expanded", abrir);
  $("botao-menu").setAttribute("aria-label", abrir ? "Fechar o menu" : "Abrir o menu");
}
function fecharMenu(devolverFoco) {
  const estavaAberto = $("lado").classList.contains("aberto");
  abrirMenu(false);
  if (estavaAberto && devolverFoco) $("botao-menu").focus();
}

$("busca").addEventListener("input", e => { estado.termo = semAcento(e.target.value.trim()); renderMenu(); });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  estado.modo = b.dataset.modo;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderMenu();
}));
$("botao-menu").addEventListener("click", () => {
  const abrir = !$("lado").classList.contains("aberto");
  abrirMenu(abrir);
  if (abrir) $("busca").focus();
});
$("menu").addEventListener("click", ev => { if (ev.target.closest("a")) fecharMenu(false); });
document.addEventListener("keydown", ev => { if (ev.code === "Escape") fecharMenu(true); });
window.addEventListener("hashchange", rotear);
rotear();
</script>
</body>
</html>
